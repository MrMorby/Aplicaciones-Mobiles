<app-menu></app-menu>

<!-- La página principal del contenido -->
<div style="padding-top: 15px;">
  <p>
    <ion-header [translucent]="true">
     <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button menu="first"></ion-menu-button>
        </ion-buttons>
        <!-- Contenedor para el título y la barra de búsqueda -->
       <div class="toolbar-content" >
         <ion-searchbar class="custom-searchbar" placeholder="Buscar en Marketplace..."></ion-searchbar>
       </div>
      </ion-toolbar>
    </ion-header>
  </p>
 </div>


<ion-content class="ion-padding">

  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-card>
        <img [src]="product.image" alt="Imagen del Producto" />
        <ion-card-header>
          <ion-card-title><h3>{{ product.name }}</h3></ion-card-title>
          <ion-card-subtitle>Precio: {{ product.price }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{ product.description }}  <br>
          Publicado por: {{ product.sellerName }} <br>
          ID Producto: {{ product.id }}
        </ion-card-content>
      </ion-card>
      <ion-fab horizontal="end">
        <ion-button routerLink='/Comprar' color="success">
          Comprar ‎ ‎  
          <ion-icon  name="pricetag-outline"></ion-icon>
        </ion-button>
      </ion-fab>
      
    </ion-item>
  </ion-list>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button routerLink='/publicate-product'>
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>


<ion-content [fullscreen]="true" id="main-content">
  <div id="map-container" style="width: 100%; height: auto;">
    <div id="map" style="height: 200px; width: 100%;"></div>  <!-- Ajusta la altura aquí -->
  </div>

</ion-content>
