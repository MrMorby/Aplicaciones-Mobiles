<ion-header>
    <app-back-button></app-back-button>
</ion-header>

<h2 class="title">Login</h2>

<ion-content class="ion-padding page-home">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input formControlName="email" type="email"></ion-input>
    </ion-item>
    <ion-note *ngIf="loginForm?.get('email')?.invalid && loginForm?.get('email')?.touched" color="danger">
      Ingresa un correo válido.
    </ion-note>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input formControlName="password" type="password"></ion-input>
    </ion-item>
    <ion-note *ngIf="loginForm?.get('password')?.invalid && loginForm?.get('password')?.touched" color="danger">
      La contraseña es requerida.
    </ion-note>

    <div class="button-container" style="display: flex; flex-direction: column; align-items: stretch; gap: 10px;">
      <ion-button expand="block" color="primary" type="submit" [disabled]="loginForm.invalid">Confirmar</ion-button>
      <ion-button routerLink='/forgot-password' expand="block" color="tertiary">¿Olvidaste tu contraseña?</ion-button>
    </div>
  </form>
</ion-content>
